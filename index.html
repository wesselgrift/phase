<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="phase.">
<meta name="theme-color" content="#F4F3F0">
<title>phase.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (latin subset, SIL OFL), so the app makes no third-party requests. */
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/dm-sans.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/source-serif-4.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:italic;font-weight:200 900;font-display:swap;src:url(fonts/source-serif-4-italic.woff2) format('woff2')}
:root{
  --bg:#F4F3F0; --card:#FFFFFF; --ink:#141414; --ink2:#4E4C48; --muted:#8B8984; --line:#E6E3DD; --chip:#ECEAE5;
  /* Phase colors mark the ring, chart bands, bars and dots. --period is the stronger red for period UI with white text. */
  --menstrual:#EA6D56; --follicular:#27B892; --ovulatory:#E8A127; --luteal:#8979E6; --premenstrual:#DB6EA5; --period:#C8462E;
  --serif:'Source Serif 4',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --r:28px;
}
[data-theme=dark]{ --bg:#000000; --card:#1A1A19; --ink:#F2F1EE; --ink2:#C4C1BB; --muted:#85837E; --line:#2A2928; --chip:#232322;
  --menstrual:#DC604A; --follicular:#00A883; --ovulatory:#C78200; --luteal:#8675E3; --premenstrual:#CD6199; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* App-like: no double-tap zoom. Pinch zoom is blocked in the script (iOS ignores the viewport for it). */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
body{transition:background .4s,color .4s}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit}
.i svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

.screen{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:16px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 4px 0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.hello{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.streak{height:42px;padding:0 14px 0 10px;border-radius:21px;background:var(--card);display:flex;align-items:center;gap:6px;font-weight:600}
.streak .ic{width:20px;height:20px}
.streak.on .ic{stroke:var(--period)}

.card{background:var(--card);border-radius:var(--r);padding:22px}
.card.invert{background:var(--ink);color:var(--bg)}
.card.invert .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.card h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;letter-spacing:-.01em}
.card h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.lede{color:var(--ink2);margin-top:8px}
.fine{font-size:13px;color:var(--muted);margin-top:14px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.serif{font-family:var(--serif)}

.btn{height:52px;padding:0 26px;border-radius:26px;background:var(--ink);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.light{background:var(--bg);color:var(--ink)}
.btn.period{background:var(--period);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--r);padding:12px 10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;color:var(--ink);font-size:15px;position:relative}
.wd.today{color:var(--ink);font-weight:600}
.wd.today b{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wd .mk{width:5px;height:5px;border-radius:50%;background:transparent}
.wd .mk.on{background:var(--ink)}
.period-fill{background:var(--period)!important;color:#fff!important;box-shadow:none!important}
.pred-ring{outline:1.5px dashed var(--period);outline-offset:-1.5px;box-shadow:none!important}
.fertile-fill{background:color-mix(in srgb,var(--ovulatory) 18%,transparent)}
.ov-ring{box-shadow:inset 0 0 0 2px var(--ovulatory)!important}

/* hero ring */
.hero{display:flex;justify-content:center;padding:6px 0 0}
.ring{width:min(300px,82vw);height:auto;overflow:visible}
.ring .num{font-family:var(--serif);font-size:76px;font-weight:500;fill:var(--ink);letter-spacing:-.02em}
.ring .lab{font-size:12px;letter-spacing:.12em;fill:var(--muted);font-weight:500}
.ring .ph{font-size:17px;fill:var(--ink);font-weight:600}
.ring .sub{font-size:14px;fill:var(--muted)}
.center-actions{display:flex;justify-content:center;gap:10px;margin-top:-4px}
.fine.sure{text-align:center;margin:0 auto;max-width:300px}

/* check-in card */
.checkin .eyebrow .ic{width:16px;height:16px}
.checkin h2{margin:14px 0 20px}
.checkin .done{display:flex;align-items:center;gap:14px;margin-top:14px}
svg.face{width:44px;height:44px;flex:none}
.checkin .done svg.face{width:44px;height:44px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:12px;background:var(--chip);color:var(--ink2)}
.card.invert .tag{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}

/* phase card */
.phase h2{margin-top:10px}
.phase h3.sec{margin:24px 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols h4{margin:0 0 8px;font-size:13.5px;font-weight:600}
.good li{position:relative;padding-left:15px}
.good li:before{content:'';position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--tint)}
.helps{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink2)}
details.mild{background:none;padding:0;border-radius:0;margin-top:18px;border-top:1px solid var(--line)}
details.mild summary{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted);padding:14px 0 4px}
details.mild summary:after{font-size:20px}
details.mild ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
.lift{background:color-mix(in srgb,var(--tint) 28%,var(--card))}
/* Labels use ink2: muted is too light on the tint. */
.lift .eyebrow,.lift .next span{color:var(--ink2)}
.lift .eyebrow .ic{width:16px;height:16px}
.lift h2{margin-top:12px}
.next{display:flex;flex-direction:column;gap:2px;margin-top:16px;padding:12px 16px;border-radius:16px;background:var(--card)}
.next span{font-size:13px;color:var(--muted)}
.next b{font-weight:600;font-size:16px}
.mine{margin-top:16px;font-family:var(--serif);font-size:18px;line-height:1.4}
.mine .eyebrow{font-family:var(--sans);display:flex;margin-bottom:4px}
.cols ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.cols li{font-size:14.5px;color:var(--ink2);line-height:1.4}
@media (max-width:380px){.cols{grid-template-columns:1fr}}
.hchart,.mchart{width:100%;height:auto;margin-top:16px;touch-action:pan-y;overflow:visible}
.hchart text,.mchart text{font-size:11px;fill:var(--muted);font-family:var(--sans)}
.hchart .tip{fill:var(--ink);font-weight:600;font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;border-top:2px solid var(--ink)}

/* quote */
.quote blockquote{margin:0;font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:400}
.quote cite{display:block;margin-top:14px;font-style:normal;color:var(--muted);font-size:14px}
.echo-row{display:flex;gap:14px;align-items:center;margin-top:12px}
.echo svg.face{width:40px;height:40px;flex:none}
.echo p.note{font-family:var(--serif);font-style:italic;color:var(--ink2);margin-top:12px;font-size:17px}
.banner{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:18px;padding:10px 14px;font-size:14px;color:var(--ink2)}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:4px;padding:6px;border-radius:32px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 6px 30px rgba(0,0,0,.08);z-index:5}
.tab{width:62px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:500}
.tab .ic{width:21px;height:21px}
.tab.on{background:var(--ink);color:var(--bg)}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head h2{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);letter-spacing:.06em;padding-bottom:6px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.cd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:15px}
.cd.today b{font-weight:700;text-decoration:underline;text-underline-offset:4px}
.cd .mk{width:4px;height:4px;border-radius:50%}
.cd .mk.on{background:var(--ink)}
.cd.out{visibility:hidden}
.keys{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys b{width:14px;height:14px;border-radius:50%;display:inline-block}

/* journey */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:22px;padding:16px 18px}
.stat .v{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1;margin-top:4px}
.stat .v small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:400;margin-left:4px}
.stat .s{font-size:12.5px;color:var(--muted)}
/* mood bars: one row per cycle, one bar per day, taller is a better mood */
.mrows{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.mrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:end}
.mrow>span{font-size:11px;color:var(--muted);white-space:nowrap;line-height:1}
.mbars{display:grid;gap:3px;height:22px;min-width:0}
.mb{position:relative;height:100%;min-width:0}
.mb::after{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--h);min-height:2px;border-radius:1px;background:var(--muted)}
.mb.none::after{background:var(--line)}
.mb.p::after{background:var(--period)}
.legend .lgb{display:inline-block;width:3px;height:12px;border:0;border-radius:1px;background:var(--muted)}
.legend .lgb.p{background:var(--period)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;padding-left:calc(var(--lw) + 8px)}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.bar-row{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.bar-row .track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar-row .fill{height:100%;border-radius:0 4px 4px 0}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.brings{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.brings .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.hist{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.hist th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist td{padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.note-card{border:1.5px solid var(--line);background:transparent}
.note-card ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.empty-state{text-align:center;padding:36px 22px}
.empty-state h2{margin-bottom:8px}

/* learn */
details{background:var(--card);border-radius:var(--r);padding:0 22px}
summary{list-style:none;cursor:pointer;padding:20px 0;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:21px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary:after{content:'+';font-family:var(--sans);font-weight:300;font-size:26px;color:var(--muted);transition:transform .2s}
details[open] summary:after{transform:rotate(45deg)}
details .body{padding-bottom:22px;color:var(--ink2);display:flex;flex-direction:column;gap:12px;font-size:15px}
details .body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
details .body h4{margin:6px 0 0;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:center}
.ev{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:8px;background:var(--chip);color:var(--ink2);font-weight:600;margin-left:6px;white-space:nowrap}

/* overlay: flow + sheet */
.flow{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.flow-top{max-width:480px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 0;display:flex;align-items:center;gap:14px}
.progress{flex:1;display:flex;gap:5px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--ink)}
.flow-body{flex:1;overflow-y:auto;max-width:480px;width:100%;margin:0 auto;padding:36px 20px 20px;display:flex;flex-direction:column}
.step{display:flex;flex-direction:column;gap:10px;flex:1}
.step.anim{animation:rise .4s ease both}
.step h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;letter-spacing:-.01em}
.step .sub{color:var(--muted)}
.flow-foot{max-width:480px;width:100%;margin:0 auto;padding:12px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;gap:10px}
.faces{display:flex;justify-content:space-between;margin-top:40px;gap:4px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:1;transition:transform .2s}
.faces svg{width:54px;height:54px;transition:transform .2s;color:var(--muted)}
.faces button.on{color:var(--ink);font-weight:600}
.faces button.on svg{color:var(--ink);transform:scale(1.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{padding:10px 16px;border-radius:22px;background:var(--card);font-size:15px;font-weight:500;transition:background .15s,color .15s}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:22px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:10px 0;border-radius:18px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--period);color:#fff}
.seg button.on.none{background:var(--ink);color:var(--bg)}
.slider-wrap{margin-top:56px;text-align:center}
.slider-wrap .big{font-family:var(--serif);font-size:28px;margin-bottom:28px;min-height:40px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);border:4px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--bg)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px}
textarea{width:100%;flex:1;min-height:220px;margin-top:20px;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.5}
textarea::placeholder{color:var(--muted)}
.done-step{align-items:center;text-align:center;justify-content:center}
.done-step .flame{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin-bottom:10px}
.done-step .flame .ic{width:36px;height:36px;stroke:var(--period)}
.done-step .echo-line{font-family:var(--serif);font-size:19px;color:var(--ink2);margin-top:18px;max-width:330px}
.date-in{display:block;margin-top:36px;width:100%;height:60px;border-radius:20px;border:0;background:var(--card);color:var(--ink);font:500 20px var(--sans);padding:0 18px}
.stepper{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:48px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--card);font-size:26px;font-weight:300}
.stepper .n{font-family:var(--serif);font-size:72px;font-weight:500;min-width:110px;text-align:center;line-height:1}
.stepper-unit{text-align:center;color:var(--muted);margin-top:6px}
/* welcome story */
.story{flex:1;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;min-height:0}
.st-bars{display:flex;gap:5px}
.st-bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.st-bars b{position:absolute;inset:0;width:0;background:var(--ink)}
.st-bars i.done b{width:100%}
.st-bars i.now b{animation:st-fill 6s linear forwards}
@keyframes st-fill{to{width:100%}}
.st-scenes{flex:1;position:relative;cursor:pointer;min-height:420px}
.st-scene{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .45s;pointer-events:none}
.st-scene.active{opacity:1}
.st-vis{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.st-cap{padding-bottom:8px}
.st-cap h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin-top:6px}
.st-cap .brand{font-size:40px}
.st-rise{opacity:0;transform:translateY(12px)}
.active .st-rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
.st-ring{width:min(250px,66vw);height:auto;overflow:visible}
.st-arc{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.active .st-arc{animation:st-draw .9s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes st-draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
.st-check{display:flex;flex-direction:column;align-items:center}
.st-faces{display:flex;gap:6px;margin-top:16px;position:relative}
.st-faces span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);width:50px}

/* ---------- dates (all dates are local 'YYYY-MM-DD' strings) ---------- */
const pad2 = n => String(n).padStart(2, '0');

const fmt = (s, o) => parse(s).toLocaleDateString('en-GB', o);
const fmtLong = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => fmt(s, { day: 'numeric', month: 'short' });
const fmtDate = s => fmt(s, { day: 'numeric', month: 'long', year: 'numeric' });

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const pick = (arr, seed) => arr[hash(seed) % arr.length];

/* ---------- storage ---------- */
const KEY = 'phase.v1';
// Bump SCHEMA and extend migrate() when the shape of the stored data changes.
const SCHEMA = 1;
const fresh = () => ({ v: SCHEMA, onboarded: false, settings: { cycleLength: 28, periodLength: 5, theme: 'auto', hormonalBC: false, sample: false, lastBackup: null, backupSnooze: null, installSnooze: null }, periods: [], logs: {} });
// Brings stored data or a backup from any older version up to the current shape.
function migrate(data) {
  if ((data.v || 0) > SCHEMA) throw new Error('newer');
  const f = fresh();
  return { ...f, ...data, v: SCHEMA, settings: { ...f.settings, ...data.settings } };
}

/* Optional passcode: the stored data is AES-GCM encrypted with a key derived from the passcode. */
const ITER = 310000;
const canEncrypt = !!(window.crypto && crypto.subtle);
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function newLock(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { key: await deriveKey(pass, salt, ITER), salt, iter: ITER };
}
async function seal(json, l) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, l.key, new TextEncoder().encode(json));
  return JSON.stringify({ enc: 1, iter: l.iter, salt: b64(l.salt), iv: b64(iv), data: b64(data) });
}
// Throws when the passcode is wrong.
async function unseal(raw, pass) {
  const salt = unb64(raw.salt), key = await deriveKey(pass, salt, raw.iter);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(raw.iv) }, key, unb64(raw.data));
  return { data: migrate(JSON.parse(new TextDecoder().decode(buf))), lock: { key, salt, iter: raw.iter } };
}

let db = null;     // null while locked
let lock = null;   // the passcode key, when a passcode is on
let sealed = null; // the encrypted data, while locked
try {
  const raw = JSON.parse(localStorage.getItem(KEY));
  if (raw?.enc) sealed = raw; else db = raw ? migrate(raw) : fresh();
} catch { db = fresh(); }
let ver = 0;
// Writes run in order, so a slow encrypted write never lands after a newer one.
let writing = Promise.resolve();
function save() {
  ver++;
  const json = JSON.stringify(db), l = lock;
  writing = writing.then(() => (l ? seal(json, l) : json)).then(s => localStorage.setItem(KEY, s))
    .catch(() => toast('Could not save. Storage may be full or blocked.'));
}

// Ask the browser not to clear the data when space runs low. Home-screen apps usually get this.
let persisted = null;
async function persist() {
  if (!navigator.storage?.persist) return;
  try { persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch {}

// Luteal phase is roughly fixed (~14 days), so ovulation ≈ cycle length − 14.
function phaseOf(day, L, P) {
  const ov = L - 14;
  if (day <= P) return 'menstrual';
  if (day < ov - 1) return 'follicular';
  if (day <= ov + 1) return 'ovulatory';
  if (day <= L - 7) return 'luteal';
  return 'premenstrual';
}

  const t = today();

  const ps = [...db.periods].sort((a, b) => (a.start < b.start ? -1 : 1));
  const starts = ps.map(p => p.start);
  const gaps = [];
  for (let i = 1; i < starts.length; i++) {
    const g = diff(starts[i - 1], starts[i]);
    if (g >= 15 && g <= 60) gaps.push(g);
  }
  const recent = gaps.slice(-6);
  const L = recent.length ? Math.round(avg(recent)) : db.settings.cycleLength;
  // The next start as a range of cycle lengths: shortest to longest recent cycle, at least ±1 day.
  // With little data the range is wider, because the average is still a guess.
  const pad = recent.length >= 3 ? 1 : recent.length === 2 ? 2 : 3;
  const lo = Math.min(L - pad, ...recent), hi = Math.max(L + pad, ...recent);
  const irregular = recent.length >= 3 && Math.max(...recent) - Math.min(...recent) > 7;
  const lens = ps.filter(p => p.end).map(p => diff(p.start, p.end) + 1).filter(n => n > 0 && n < 15).slice(-6);
  const P = lens.length ? Math.round(avg(lens)) : db.settings.periodLength;
  const last = starts[starts.length - 1] || null;
  const ongoing = !!last && !ps[ps.length - 1].end && diff(last, t) < P + 5;
  const ranges = ps.map((p, i) => ({
    start: p.start,
    end: p.end || (i === ps.length - 1 && ongoing ? t : addDays(p.start, P - 1)),
  }));
  let day = null, late = 0, nextStart = null;
  if (last) {
    day = diff(last, t) + 1;
    late = Math.max(0, day - L);
    nextStart = late ? addDays(t, 1) : addDays(last, L);
  }
  memo = { ver, t, ps, starts, gaps, recent, L, lo, hi, irregular, P, last, ongoing, ranges, day, late, nextStart };
  return memo;
}

function dayInfo(s) {
  const m = M();
  if (!m.last) return null;
  const loggedPeriod = m.ranges.some(r => s >= r.start && s <= r.end);
  let i = m.starts.length - 1;
  while (i >= 0 && m.starts[i] > s) i--;
  if (i < 0) return { loggedPeriod };
  let cs, len, current = false;
  if (i < m.starts.length - 1) { cs = m.starts[i]; len = diff(cs, m.starts[i + 1]); }
  else if (s < m.nextStart) { cs = m.last; len = m.L; current = true; }
  else { cs = addDays(m.nextStart, Math.floor(diff(m.nextStart, s) / m.L) * m.L); len = m.L; current = true; }
  const day = diff(cs, s) + 1;
  const ov = len - 14;
  return {
    day, len, cs, loggedPeriod,
    phase: phaseOf(day, len, m.P),
    predictedPeriod: !loggedPeriod && s > m.t && day <= m.P,
    fertile: current && day >= ov - 5 && day <= ov + 1,
    ovulation: current && day === ov,
  };
}

function streak() {
  let d = db.logs[today()] ? today() : addDays(today(), -1), n = 0;
  while (db.logs[d]) { n++; d = addDays(d, -1); }
  return n;
}

// Same cycle day in the previous cycle (±1 day), for the "one cycle ago" echo.
function echoFor(s) {
  const m = M(), info = dayInfo(s);
  if (!info || !info.day) return null;
  const idx = m.starts.indexOf(info.cs);
  if (idx < 1) return null;
  const base = addDays(m.starts[idx - 1], info.day - 1);
  for (const off of [0, -1, 1]) {
    const d = addDays(base, off);
    if (d < info.cs && db.logs[d]) return { date: d, log: db.logs[d], day: info.day };
  }
  return null;
}

/* ---------- looking ahead ---------- */
// Average mood per cycle day, across all logged cycles.
function moodByDay() {
  const m = M(), days = {};
  for (const [d, log] of Object.entries(db.logs)) {
    const f = dayInfo(d);
    if (!f?.day || d > m.t || !log.mood) continue;
    (days[f.day] ||= []).push(log.mood);
  }
  return days;
}
const enoughData = days => Object.values(days).flat().length >= 20;

// Her 5-day window with the highest average mood, if it clearly stands out.
function bestStretch() {
  const m = M(), days = moodByDay();
  if (!enoughData(days)) return null;
  const all = avg(Object.values(days).flat());
  let best = null;
  for (let a = 1; a + 4 <= m.L; a++) {
    const v = [0, 1, 2, 3, 4].flatMap(i => days[a + i] || []);
    if (v.length >= 5 && (!best || avg(v) > best.mean)) best = { from: a, to: a + 4, mean: avg(v) };
  }
  return best && best.mean >= all + 0.2 ? best : null;
}

// First cycle day on which her mood is usually back to her normal level.
function reliefDay() {
  const days = moodByDay();
  if (!enoughData(days)) return null;
  const normal = avg(Object.values(days).flat());
  for (let d = 1; d <= 8; d++) if ((days[d] || []).length >= 2 && avg(days[d]) >= normal - 0.15) return d;
  return null;
}

// Positive feelings she logs in at least 30% of check-ins in this phase.
function phasePositives(phase) {
  const m = M(), c = {};
  let n = 0;
  for (const [d, log] of Object.entries(db.logs)) {
    if (d > m.t || dayInfo(d)?.phase !== phase) continue;
    n++;
    [...(log.feelings || []), ...(log.symptoms || [])].filter(x => POSITIVE.includes(x)).forEach(x => (c[x] = (c[x] || 0) + 1));
  }
  if (n < 5) return [];
  return Object.entries(c).filter(([, k]) => k / n >= 0.3).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([x, k]) => [x, Math.round((k / n) * 100)]);
}

// Where her hormones are now, and the next good thing with a date.
function lookingAhead() {
  const m = M(), t = m.t, day = m.day, ov = m.L - 14, phase = dayInfo(t).phase;
  const on = n => fmt(addDays(t, n), { weekday: 'short', day: 'numeric', month: 'short' });
  const when = n => (n <= 0 ? 'around now' : n === 1 ? 'tomorrow' : `in ${n} days · ${on(n)}`);
  if (phase === 'menstrual' && day <= 2) return {
    title: 'The hardest days pass quickly',
    body: 'Cramps usually peak on days 1 and 2. Estrogen is low now, but it starts to climb again soon.',
    next: ['Cramps usually ease', when(3 - day)],
  };
  if (phase === 'menstrual') return {
    title: 'The worst is usually behind you',
    body: 'Cramps tend to fade after day 2, and any PMS tension is lifting. Estrogen is getting ready to climb.',
    next: ['Bleeding usually ends', when(m.P - day)],
  };
  if (phase === 'follicular') return {
    title: 'Estrogen is on the rise',
    body: 'It climbs a little every day until ovulation. Many people feel brighter and more energetic in this stretch. See if you do.',
    next: ['Estrogen peaks', when(ov - 1 - day)],
  };
  if (phase === 'ovulatory') return {
    title: 'Estrogen is at its peak',
    body: 'Desire often peaks in these fertile days. Next, progesterone rises. Many people find it calming.',
    next: ['Progesterone starts to rise', when(ov + 2 - day)],
  };
  if (phase === 'luteal') return {
    title: 'Progesterone is at work',
    body: 'It peaks about a week after ovulation. For many people it brings calmer, sleepier evenings.',
    next: ['Progesterone peaks', when(ov + 7 - day)],
  };
  // Late luteal: PMS usually fades within ~4 days of bleeding.
  const toPeriod = m.late ? 1 : diff(t, m.nextStart);
  return {
    title: 'Lighter days are close',
    body: 'Your hormones are falling, and that can feel rough. It is temporary. Once your period starts, PMS usually fades within about 4 days.',
    next: ['Lighter days expected', `around ${on(toPeriod + 4)}`],
  };
}

// One personal, positive line from her own log, or null if there is not enough data.
function fromYourLog(phase, day) {
  const m = M(), best = bestStretch(), relief = reliefDay();
  if (best && day >= best.from && day <= best.to) return `You are in your usual best stretch, days ${best.from}\u2060–\u2060${best.to}.`;
  if (relief === 1 && phase === 'premenstrual') return 'Your mood usually lifts as soon as your period starts.';
  if (relief && phase === 'premenstrual') return `Your mood is usually back to normal by day ${relief} of your next cycle.`;
  if (relief && phase === 'menstrual' && relief > day) return `Your mood is usually back to normal by day ${relief}. That is ${relief - day === 1 ? 'tomorrow' : `in ${relief - day} days`}.`;
  if (best) {
    const n = (best.from - day + m.L) % m.L;
    if (n > 0 && n <= 12) return `Your best days usually fall on days ${best.from}\u2060–\u2060${best.to}. They start in ${n} day${n > 1 ? 's' : ''}.`;
  }
  const pos = phasePositives(phase);
  if (pos.length) return `In this phase you often log ${pos.map(([x, p]) => `${x.toLowerCase()} (${p}%)`).join(' and ')}.`;
  return null;
}

/* ---------- ui state ---------- */
/* ---------- home screen install ---------- */
// iOS has no install prompt, so it gets instructions. Chrome, Edge and Android get the browser's own prompt.
const home = {
  standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  // iPadOS reports a Mac user agent, so also check for touch.
  ios: /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  prompt: null,
};
const canInstall = () => !home.standalone && (home.ios || !!home.prompt);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); home.prompt = e; if (db && !ui.flow) render(); });
window.addEventListener('appinstalled', () => { home.prompt = null; if (db && !ui.flow) render(); });
const installDue = () => canInstall() && !(db.settings.installSnooze && today() < db.settings.installSnooze);

const partOfDay = () => { const h = new Date().getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; };
const ui = { tab: 'today', month: today().slice(0, 7), flow: null, sheet: null, ob: { step: 0, date: addDays(today(), -10), L: 28, P: 5 } };

/* ---------- components ---------- */
function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function phaseSpans(L, P) {
  const spans = [];
  for (let d = 1; d <= L; d++) {
    const k = phaseOf(d, L, P), s = spans[spans.length - 1];
    if (s && s.k === k) s.b = d; else spans.push({ k, a: d, b: d });
  }
  return spans;
}

function ring() {
  const m = M(), L = m.L, cx = 150, cy = 150, r = 128, step = (2 * Math.PI) / L, top = -Math.PI / 2;
  // Half-gap per segment end: the round cap (6px) plus 3px of visible space, as an angle.
  const gap = (6 + 3) / r;
  const bc = db.settings.hormonalBC;
  const segs = phaseSpans(L, m.P).map(s =>
    `<path d="${arc(cx, cy, r, top + (s.a - 1) * step + gap, top + s.b * step - gap)}" stroke="var(--${bc ? 'line' : s.k})" stroke-width="12" fill="none" stroke-linecap="round"/>`).join('');
  const ov = L - 14;
  const fert = bc ? '' : `<path d="${arc(cx, cy, r - 20, top + (ov - 6) * step, top + (ov + 1) * step)}" stroke="var(--ovulatory)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75"/>`;
  const d = Math.min(m.day, L), a = top + (d - 0.5) * step;
  const mx = cx + r * Math.cos(a), my = cy + r * Math.sin(a);
  const info = dayInfo(m.t), ph = PHASES[info.phase];
  let sub;
  if (m.ongoing) sub = `Period · day ${m.day}`;
  else {
    // Days until the earliest and latest likely start.
    const a = m.lo - m.day + 1, b = m.hi - m.day + 1;
    if (b < 0) sub = `Period is ${m.late} day${m.late > 1 ? 's' : ''} late`;
    else if (a <= 0) sub = 'Period may start any day now';
    else sub = `Period in ${a}\u2060–\u2060${b} days`;
  }
  return `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="Cycle day ${m.day} of about ${L}. ${ph.name} phase. ${sub}.">
    ${segs}${fert}
    <circle cx="${mx}" cy="${my}" r="11" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
    <text x="150" y="98" text-anchor="middle" class="lab">CYCLE DAY</text>
    <text x="150" y="172" text-anchor="middle" class="num">${m.day}</text>
    <text x="150" y="204" text-anchor="middle" class="ph">${bc ? 'Since last bleed' : ph.name + ' phase'}</text>
    <text x="150" y="228" text-anchor="middle" class="sub">${sub}</text>
  </svg>`;
}

// Schematic hormone curves (shape only, not measured levels).
const gauss = (x, mu, s) => Math.exp(-((x - mu) ** 2) / (2 * s * s));
const HORMONES = [
  { k: 'Estrogen', f: (d, ov) => 0.12 + 0.78 * gauss(d, ov - 1, d < ov - 1 ? 4.5 : 1.6) + 0.36 * gauss(d, ov + 7, 3.2), style: 'stroke:var(--ink)' },
  { k: 'Progesterone', f: (d, ov) => 0.05 + 0.86 * gauss(d, ov + 7, 3), style: 'stroke:var(--ink2);stroke-dasharray:6 4' },
  { k: 'LH', f: (d, ov) => 0.05 + 0.88 * gauss(d, ov - 0.5, 0.9), style: 'stroke:var(--muted);stroke-dasharray:1.5 4' },
];
function hormoneChart(L, day) {
  const W = 320, H = 150, px = 4, top = 22, bot = 118, ov = L - 14, P = M().P;
  const x = d => px + ((d - 1) / (L - 1)) * (W - 2 * px);
  const y = v => bot - v * (bot - top);
  const lines = HORMONES.map(h => {
    let p = '';
    for (let d = 1; d <= L; d += 0.25) p += `${p ? 'L' : 'M'}${x(d).toFixed(1)} ${y(h.f(d, ov)).toFixed(1)}`;
    return `<path d="${p}" fill="none" stroke-width="2" stroke-linecap="round" style="${h.style}"/>`;
  }).join('');
  const band = phaseSpans(L, P).map(s => `<rect x="${x(s.a) + 1}" y="128" width="${Math.max(2, x(s.b + 1 > L ? L : s.b + 1) - x(s.a) - 2)}" height="5" rx="2.5" fill="var(--${s.k})"/>`).join('');
  const dd = Math.min(day, L);
  return `<svg class="hchart" viewBox="0 0 ${W} ${H}" data-l="${L}" role="img" aria-label="Schematic hormone curves across a ${L}-day cycle, with today marked at day ${day}.">
    <line x1="${px}" x2="${W - px}" y1="${bot}" y2="${bot}" stroke="var(--line)"/>
    ${lines}${band}
    <line class="cross" x1="${x(dd)}" x2="${x(dd)}" y1="${top - 6}" y2="${bot}" stroke="var(--ink)" stroke-width="1"/>
    <circle class="cross-dot" cx="${x(dd)}" cy="${y(HORMONES[0].f(dd, ov))}" r="4.5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>
    <text class="tip" x="${Math.min(Math.max(x(dd), 40), W - 40)}" y="10" text-anchor="middle">Today · day ${day}</text>
    <text x="${px}" y="148">Day 1</text><text x="${x(ov)}" y="148" text-anchor="middle">Ovulation ~${ov}</text><text x="${W - px}" y="148" text-anchor="end">${L}</text>
  </svg>
  <div class="legend">${HORMONES.map(h => `<span><svg width="18" height="4"><line x1="0" x2="18" y1="2" y2="2" stroke-width="2" style="${h.style}"/></svg>${h.k}</span>`).join('')}</div>`;
}
function bindCharts() {
  document.querySelectorAll('.hchart').forEach(el => {
    const L = +el.dataset.l, W = 320, px = 4, ov = L - 14, P = M().P, t = M().day;
    const cross = el.querySelector('.cross'), dot = el.querySelector('.cross-dot'), tip = el.querySelector('.tip');
    const set = d => {
      const x = px + ((d - 1) / (L - 1)) * (W - 2 * px);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      dot.setAttribute('cx', x); dot.setAttribute('cy', 118 - HORMONES[0].f(d, ov) * 96);
      tip.setAttribute('x', Math.min(Math.max(x, 60), W - 60));
      tip.textContent = `${d === Math.min(t, L) ? 'Today · ' : ''}Day ${d} · ${PHASES[phaseOf(d, L, P)].name}`;
    };
    const move = e => {
      const r = el.getBoundingClientRect();
      set(Math.min(L, Math.max(1, Math.round(((e.clientX - r.left) / r.width * W - px) / (W - 2 * px) * (L - 1) + 1))));
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerdown', move);
    el.addEventListener('pointerleave', () => set(Math.min(t, L)));
  });
}

function dayClasses(s) {
  const f = dayInfo(s);
  if (!f) return '';
  if (f.loggedPeriod) return 'period-fill';
  if (f.predictedPeriod) return 'pred-ring';
  if (db.settings.hormonalBC) return '';
  if (f.ovulation) return 'ov-ring fertile-fill';
  if (f.fertile) return 'fertile-fill';
  return '';
}

function weekStrip() {

}

function journeyData() {
  const m = M(), byPhase = {};
  PHASE_KEYS.forEach(k => (byPhase[k] = { moods: [], n: 0, counts: {} }));
  for (const [d, log] of Object.entries(db.logs)) {
    const f = dayInfo(d);
    if (!f || !f.phase || d > m.t) continue;
    const b = byPhase[f.phase];
    b.n++;
    if (log.mood) b.moods.push(log.mood);
    [...(log.feelings || []), ...(log.symptoms || [])].forEach(x => (b.counts[x] = (b.counts[x] || 0) + 1));
  }
  const cycles = m.starts.map((s, i) => ({ start: s, len: i < m.starts.length - 1 ? diff(s, m.starts[i + 1]) : null, plen: diff(m.ranges[i].start, m.ranges[i].end) + 1 }));
  return { m, byPhase, cycles };
}

function healthNotes(m, cycles) {
  const notes = [], done = cycles.filter(c => c.len);
  const short = done.filter(c => c.len < 21).length, long = done.filter(c => c.len > 35).length;
  if (short) notes.push(`${short} cycle${short > 1 ? 's were' : ' was'} shorter than 21 days.`);
  if (long) notes.push(`${long} cycle${long > 1 ? 's were' : ' was'} longer than 35 days.`);
  if (cycles.some(c => c.plen > 7)) notes.push('A period lasted longer than 7 days.');
  const recent = done.slice(-6).map(c => c.len);
  if (recent.length >= 3 && Math.max(...recent) - Math.min(...recent) > 9) notes.push('Your recent cycle lengths vary by more than 9 days.');
  if (m.late >= 7) notes.push(`Your period is ${m.late} days late. If pregnancy is possible, consider a test.`);
  return notes;
}

// Average mood per cycle day (3-day smoothing), with her best stretch shaded.
function goodStretchCard(m) {
  const days = moodByDay(), best = bestStretch(), relief = reliefDay();
  if (!best && !relief) return '';
  const W = 320, H = 132, px = 4, top = 14, bot = 100, L = m.L;
  const x = d => px + ((d - 1) / (L - 1)) * (W - 2 * px);
  const y = v => bot - ((v - 1) / 4) * (bot - top);
  const pts = [];
  for (let d = 1; d <= L; d++) {
    const v = [-1, 0, 1].flatMap(o => days[d + o] || []);
    if (v.length) pts.push([d, avg(v)]);
  }
  const line = pts.map(([d, v], i) => `${i ? 'L' : 'M'}${x(d).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const shade = best ? `<rect x="${x(best.from)}" y="${top - 8}" width="${x(best.to) - x(best.from)}" height="${bot - top + 8}" rx="6" fill="var(--ink)" opacity=".07"/>
    <text x="${(x(best.from) + x(best.to)) / 2}" y="${top - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">Best days</text>` : '';
  const band = phaseSpans(L, m.P).map(s => `<rect x="${x(s.a) + 1}" y="110" width="${Math.max(2, x(Math.min(s.b + 1, L)) - x(s.a) - 2)}" height="5" rx="2.5" fill="var(--${s.k})"/>`).join('');
  const hits = pts.map(([d, v]) => `<rect x="${x(d) - W / L / 2}" y="${top}" width="${W / L}" height="${bot - top}" fill="transparent"><title>Day ${d} · average mood ${v.toFixed(1)}</title></rect>`).join('');
  const text = [best && `Your mood is usually highest on days ${best.from}\u2060–\u2060${best.to}.`, relief && (relief === 1 ? 'It usually lifts as soon as your period starts.' : `After your period starts, it is usually back to normal by day ${relief}.`)].filter(Boolean).join(' ');
  return `<section class="card">
    <h2>Your good stretch</h2>
    <p class="lede">${text}</p>
    <svg class="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average mood per cycle day. ${text}">
      <line x1="${px}" x2="${W - px}" y1="${y(5)}" y2="${y(5)}" stroke="var(--line)"/><line x1="${px}" x2="${W - px}" y1="${y(3)}" y2="${y(3)}" stroke="var(--line)" stroke-dasharray="2 4"/><line x1="${px}" x2="${W - px}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)"/>
      ${shade}
      <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${band}${hits}
      <text x="${px}" y="130">Day 1</text><text x="${W - px}" y="130" text-anchor="end">${L}</text>
      <text x="${W - px}" y="${y(5) - 4}" text-anchor="end">Great</text><text x="${W - px}" y="${y(1) - 4}" text-anchor="end">Awful</text>
    </svg>
    <p class="fine">Your average mood on each cycle day, across all your logged cycles.</p>
  </section>`;
}

      <ul>

/* ---------- calendar file and CSV ---------- */
// The next 6 expected periods as all-day events. UIDs are stable, so importing again updates them.
function icsFile() {
  const m = M(), d8 = s => s.replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, '');
  const events = Array.from({ length: 6 }, (_, i) => {
    const s = addDays(m.nextStart, i * m.L);
    return ['BEGIN:VEVENT', `UID:phase-period-${i}@phase.local`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d8(s)}`, `DTEND;VALUE=DATE:${d8(addDays(s, m.P))}`, 'SUMMARY:Period expected',
      `DESCRIPTION:Estimate from phase. Likely start ${fmtShort(addDays(s, m.lo - m.L))} to ${fmtShort(addDays(s, m.hi - m.L))}. Not birth control.`,
      'TRANSP:TRANSPARENT', 'END:VEVENT'];
  });
  // Lines over 75 bytes must be folded: continue on the next line after a space.
  const fold = l => l.match(/.{1,73}/g).join('\r\n ');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//phase.//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:phase.', ...events.flat(), 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n';
}
// One row per check-in. The byte order mark makes Excel read the text as UTF-8.
function csvFile() {
  const cell = v => (/[",\n]/.test(v = String(v ?? '')) ? `"${v.replace(/"/g, '""')}"` : v);
  const head = ['date', 'cycle_day', 'phase', 'period', 'mood_1_5', 'energy_1_5', 'flow', 'feelings', 'symptoms', 'note'];
  const rows = Object.keys(db.logs).sort().map(d => {
    const l = db.logs[d], f = dayInfo(d);
    return [d, f?.day ?? '', db.settings.hormonalBC ? '' : PHASES[f?.phase]?.name ?? '', f?.loggedPeriod ? 'yes' : 'no', l.mood, l.energy, l.flow,
      (l.feelings || []).join('; '), (l.symptoms || []).join('; '), l.note].map(cell).join(',');
  });
  return '\ufeff' + [head.join(','), ...rows].join('\r\n');
}

// Four auto-playing scenes on the welcome screen: where you are, the check-in, your patterns, privacy.
const STORY_MS = 6000, STORY_L = 28, STORY_P = 5;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const story = { i: 0, t0: 0, timer: null };
function vStory() {
  const cx = 150, cy = 150, r = 128, step = (2 * Math.PI) / STORY_L, top = -Math.PI / 2, gap = 9 / r;
  const ring = `<svg class="st-ring" viewBox="0 0 300 300" aria-hidden="true">${phaseSpans(STORY_L, STORY_P).map((sp, i) =>
    `<path class="st-arc" pathLength="1" style="animation-delay:${i * 0.12}s" d="${arc(cx, cy, r, top + (sp.a - 1) * step + gap, top + sp.b * step - gap)}" stroke="var(--${sp.k})" stroke-width="12" fill="none" stroke-linecap="round"/>`).join('')}
    <circle class="st-mk" r="11" cx="${cx + r * Math.cos(top + 16.5 * step)}" cy="${cy + r * Math.sin(top + 16.5 * step)}" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/></svg>`;
  const faces = MOODS.map((n, i) => `<span class="${i === 3 ? 'pick' : ''}">${face(i + 1, '')}${n}</span>`).join('') + '<i class="st-tap"></i>';
  const chips = [['Calm', 1.8], ['Content', 0], ['Focused', 2.15], ['Social', 0], ['Energetic', 2.5], ['Tired', 0]]
    .map(([x, o], i) => `<span class="st-chip st-rise ${o ? 'on' : ''}" style="--d:${1.5 + i * 0.05}s;--o:${o}s">${x}</span>`).join('');
  // Seeded, so the sample mood bars look the same every time.
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const base = { menstrual: 2.9, follicular: 3.9, ovulatory: 4.3, luteal: 3.6, premenstrual: 2.5 };
  const rows = [0, 1, 2, 3].map(row => `<div class="st-mr">${Array.from({ length: STORY_L }, (_, i) => {
    const d = i + 1, miss = rnd() < 0.1, m = Math.min(5, Math.max(1, Math.round(base[phaseOf(d, STORY_L, STORY_P)] + (rnd() - 0.5) * 1.6)));
    return `<i class="${d <= STORY_P ? 'p' : ''} ${miss ? 'none' : ''}" style="height:${miss ? '2px' : m * 20 + '%'};--d:${(row * 0.22 + i * 0.018).toFixed(3)}s"></i>`;
  }).join('')}</div>`).join('');
  const dotKeys = ['menstrual', 'follicular', 'ovulatory', 'luteal', 'premenstrual'];
  const dots = Array.from({ length: 10 }, (_, i) => {
    const a = (i / 10) * 2 * Math.PI;
    return `<i class="st-dot" style="background:var(--${dotKeys[i % 5]});--x:${(96 + Math.cos(a) * 92).toFixed(0)}px;--y:${(92 + Math.sin(a) * 88).toFixed(0)}px;--d:${(0.2 + i * 0.12).toFixed(2)}s"></i>`;
  }).join('');
  const scene = (vis, cap) => `<section class="st-scene"><div class="st-vis">${vis}</div><div class="st-cap">${cap}</div></section>`;
  return `<div class="story">
    <div class="st-bars" aria-hidden="true">${'<i><b></b></i>'.repeat(4)}</div>
    <div class="st-scenes" data-a="storyNext">
      ${scene(ring, `<div class="brand st-rise">phase.</div><h1 class="st-rise" style="--d:.15s">Know where you are in your cycle.</h1>`)}
      ${scene(`<div class="st-check"><p class="eyebrow st-rise">Morning check-in</p><div class="st-faces st-rise" style="--d:.1s">${faces}</div><div class="st-chips">${chips}</div></div>`,
        `<h1 class="st-rise" style="--d:.15s">A 10-second check-in each day.</h1>`)}
      ${scene(`<div class="st-rows">${rows}</div>`, `<h1 class="st-rise" style="--d:.15s">See your own patterns, cycle after cycle.</h1>`)}
      ${scene(`<div class="st-vault">${dots}<div class="st-device"></div><svg class="st-lock" viewBox="0 0 42 56" aria-hidden="true"><g class="st-shackle"><path d="M11 26V16a10 10 0 0 1 20 0v10" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/></g><rect x="5" y="25" width="32" height="26" rx="7" fill="var(--ink)"/><circle cx="21" cy="37" r="3" fill="var(--bg)"/></svg></div>`,
        `<h1 class="st-rise" style="--d:.15s">Stays on your phone. No account, no cloud.</h1>`)}
    </div>
  </div>`;
}
// Starts the story once its markup is on screen. Renders that keep the markup do not restart it.
function storyMount() {
  const el = document.querySelector('.story');
  if (!el || el.dataset.on) return;
  el.dataset.on = '1';
  storyShow(0);
  requestAnimationFrame(storyTick);
}
function storyShow(n) {
  clearTimeout(story.timer);
  const el = document.querySelector('.story');
  if (!el) return;
  const scenes = [...el.querySelectorAll('.st-scene')], bars = [...el.querySelectorAll('.st-bars i')];
  story.i = n % scenes.length; story.t0 = performance.now();
  // Restart the CSS animations: drop the class, force a reflow, add it back.
  scenes.forEach((sc, j) => { sc.classList.remove('active'); sc.setAttribute('aria-hidden', j !== story.i); });
  bars.forEach((b, j) => { b.className = j < story.i ? 'done' : ''; });
  void el.offsetWidth;
  scenes[story.i].classList.add('active');
  bars[story.i].className = 'now';
  // With Reduce Motion, scenes only change when tapped.
  if (!reduceMotion.matches) story.timer = setTimeout(() => storyShow(story.i + 1), STORY_MS);
}
// Moves the dot around the ring in the first scene.
function storyTick(now) {
  const mk = document.querySelector('.story .st-mk');
  if (!mk) return;
  if (story.i === 0 && !reduceMotion.matches) {
    const t = now - story.t0 - 700;
    if (t > 0) {
      const a = -Math.PI / 2 + ((t / (STORY_MS - 1000)) * STORY_L % STORY_L) * ((2 * Math.PI) / STORY_L);
      mk.setAttribute('cx', 150 + 128 * Math.cos(a)); mk.setAttribute('cy', 150 + 128 * Math.sin(a));
    }
  }
  requestAnimationFrame(storyTick);
}

         <button class="row" data-a="pcOff"><span>Turn off passcode</span></button>`
      : `<button class="row" data-a="pcSetup"><span>Passcode lock</span><span class="r">Off ${I.right}</span></button>`}</div>` : ''}
    ${canInstall() ? `<div class="list"><button class="row" data-a="install"><span>Add to Home Screen</span><span class="r">${I.right}</span></button></div>` : ''}
    <div class="list">
      <button class="row" data-a="report"><span>Doctor summary</span><span class="r">Print or PDF ${I.right}</span></button>
      <button class="row" data-a="ics"><span>Add predictions to calendar</span><span class="r">.ics</span></button>
      <button class="row" data-a="csv"><span>Export check-ins</span><span class="r">.csv</span></button>
    </div>
    <div class="list">
      <button class="row" data-a="export"><span>Export backup</span><span class="r">${st.lastBackup ? `Last: ${fmtShort(st.lastBackup)}` : '.json'}</span></button>
      <button class="row" data-a="import"><span>Import backup</span></button>
      <button class="row danger" data-a="reset"><span>Delete all data</span></button>
    </div>
    <p class="fine" style="padding:0 6px">${persisted ? 'This browser keeps your data even when storage runs low.' : 'This browser may clear your data when storage runs low. On iPhone, add the app to your Home Screen. Keep a backup either way.'}</p>
  </div>`;
}

/* ---------- render ---------- */
function applyTheme() {
  const t = db?.settings.theme || 'auto', h = new Date().getHours();
  const dark = t === 'dark' || (t === 'auto' && (h >= 18 || h < 6));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#000000' : '#F4F3F0';
}
function render() {
  applyTheme();
  const app = document.getElementById('app'), ov = document.getElementById('overlay');
  if (!db) { app.innerHTML = vLock(); ov.innerHTML = ui.ask ? vAsk() : ''; document.body.classList.toggle('locked', !!ui.ask); return; }
  const views = { today: vToday, calendar: vCalendar, journey: vJourney, learn: vLearn };
  if (!db.onboarded) {
    // Keep the running welcome story when only an overlay or the theme changes.
    if (!(ui.ob.step === 0 && app.querySelector('.story'))) app.innerHTML = vOnboard();
    ov.innerHTML = ui.sheet === 'install' ? vInstall() : '';
    storyMount();
  } else {
    app.innerHTML = ui.report ? vReport() : views[ui.tab]() + vTabbar();
    ov.innerHTML = (ui.flow ? `<div class="flow">${vFlow()}</div>` : ui.sheet === 'settings' ? vSettings() : ui.sheet === 'passcode' ? vPasscode() : ui.sheet === 'install' ? vInstall() : ui.sheet ? vDaySheet(ui.sheet) : '') + (ui.ask ? vAsk() : '');
  }
  // Slide a sheet in only when it first opens, not when its content changes.
  if (ui.sheet && ui.sheet !== ui.shownSheet) ov.querySelectorAll('.backdrop,.sheet').forEach(el => el.classList.add('anim'));
  ui.shownSheet = ui.sheet;
  document.body.classList.toggle('locked', !!(ui.flow || ui.sheet || ui.ask));
  bindCharts();
}
function renderOverlay() {
  document.querySelector('#overlay .flow').innerHTML = vFlow();
}
let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

/* ---------- period edits ---------- */
function startPeriod(s) {
  const m = M();
  // A start within 9 days before an existing period moves that period earlier.
  const near = db.periods.find(p => p.start > s && diff(s, p.start) <= 9);
  if (near) near.start = s;
  else if (!m.ranges.some(r => s >= r.start && s <= r.end)) db.periods.push({ start: s });
  save();
}
function endPeriod(s) {
  const p = [...db.periods].sort((a, b) => (a.start < b.start ? 1 : -1)).find(p => p.start <= s && diff(p.start, s) <= 14);
  if (p) { p.end = s; save(); }
}

/* ---------- confirm sheet ---------- */
// In-app replacement for window.confirm, which some browsers and home-screen apps block.
function ask(title, text, yes, onYes) { ui.ask = { title, text, yes, onYes }; render(); }
const vAsk = () => `<div class="backdrop ask-backdrop anim" data-a="askNo"></div>
  <div class="sheet ask anim" role="alertdialog" aria-label="${esc(ui.ask.title)}">
    <div class="grab"></div><h2>${esc(ui.ask.title)}</h2><p>${esc(ui.ask.text)}</p>
    <button class="btn block period" data-a="askYes">${esc(ui.ask.yes)}</button>
    <button class="btn block ghost" data-a="askNo">Cancel</button>
  </div>`;

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- actions ---------- */
const A = {
  tab(v) { ui.tab = v; ui.sheet = null; render(); window.scrollTo(0, 0); },
  settings() { ui.sheet = 'settings'; render(); },
  day(v) { ui.sheet = v; render(); },
  closeSheet() { ui.sheet = null; render(); },
  month(v) { const [y, m] = ui.month.split('-').map(Number); ui.month = iso(new Date(y, m - 1 + Number(v), 1)).slice(0, 7); render(); },

  storyNext() { storyShow(story.i + 1); },
  ob(v) { ui.ob.step = Math.max(0, ui.ob.step + Number(v)); render(); },
  obN(v) {
    const [k, n] = v.split(':'), o = ui.ob;
    o[k] = Math.min(k === 'L' ? 45 : 10, Math.max(k === 'L' ? 18 : 2, o[k] + Number(n)));
    render();
  },
  obDone() {
    Object.assign(db.settings, { cycleLength: ui.ob.L, periodLength: ui.ob.P });
    db.periods = [{ start: ui.ob.date }];
    if (diff(ui.ob.date, today()) >= ui.ob.P) db.periods[0].end = addDays(ui.ob.date, ui.ob.P - 1);
    db.onboarded = true; save(); render(); persist();
  },
  sample() { db = sampleData(); save(); ui.tab = 'today'; render(); },
  clearSample() {
    ask('Remove the sample data?', 'You can then set up your own cycle.', 'Remove sample data', () => { db = fresh(); save(); ui.ob.step = 1; });
  },

  checkin(v) { ui.sheet = null; openFlow(v); render(); },
  fl(v) { ui.flow.step += v === 'next' ? 1 : -1; renderOverlay(); },
  flMood(v) { ui.flow.d.mood = Number(v); renderOverlay(); setTimeout(() => { if (ui.flow?.step === 0) A.fl('next'); }, 280); },
  flToggle(v) {
    const [k, x] = v.split(':'), arr = ui.flow.d[k];
    arr.includes(x) ? arr.splice(arr.indexOf(x), 1) : arr.push(x);
    renderOverlay();
  },
  flFlow(v) { ui.flow.d.flow = v; renderOverlay(); },
  flSave() {
    const { date, d } = ui.flow;
    db.logs[date] = { mood: d.mood, feelings: d.feelings, energy: d.energy, symptoms: d.symptoms, flow: d.flow, note: (d.note || '').trim(), prompt: d.prompt };
    save();
    // Logging real bleeding outside a known period starts a period on that day.
    const info = dayInfo(date);
    if (['light', 'medium', 'heavy'].includes(d.flow) && !info?.loggedPeriod) { startPeriod(date); toast('Period logged as starting this day. You can change it in the calendar.'); }
    ui.flow.step = STEPS.indexOf('done');
    renderOverlay();
  },
  flClose() { ui.flow = null; render(); },

  periodStart(v) { startPeriod(v); ui.sheet = null; render(); toast('Period start saved.'); },
  periodEnd(v) { endPeriod(v); ui.sheet = null; render(); toast('Period end saved.'); },
  periodRemove(v) {
    ask('Remove this period?', 'Your check-ins stay. Only the period start is removed.', 'Remove period', () => {
      db.periods = db.periods.filter(p => p.start !== v);
      save(); ui.sheet = null;
    });
  },

  setVal(v) {
    const [k, x] = v.split(':');
    db.settings[k] = x === 'true' ? true : x === 'false' ? false : x;
    save(); render();
  },
  setN(v) {
    const [k, n] = v.split(':'), lim = k === 'cycleLength' ? [18, 45] : [2, 10];
    db.settings[k] = Math.min(lim[1], Math.max(lim[0], db.settings[k] + Number(n)));
    save(); render();
  },
  export() {
    if (!db.settings.sample) Object.assign(db.settings, { lastBackup: today(), backupSnooze: null });
    download(`phase-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
    save(); render();
  },
  report() { ui.report = true; ui.sheet = null; render(); window.scrollTo(0, 0); },
  reportClose() { ui.report = false; render(); window.scrollTo(0, 0); },
  print() { window.print(); },
  ics() {
    if (!M().last) return toast('Log a period first.');
    ask('Add predictions to your calendar?', 'This saves a calendar file with your next 6 expected periods. If your calendar syncs to an online account, these events will sync too.', 'Save calendar file', () =>
      download('phase-predictions.ics', icsFile(), 'text/calendar'));
  },
  csv() {
    if (!Object.keys(db.logs).length) return toast('No check-ins to export yet.');
    download(`phase-check-ins-${today()}.csv`, csvFile(), 'text/csv');
  },
  async install() {
    if (!home.prompt) { ui.sheet = 'install'; render(); return; }
    const p = home.prompt;
    home.prompt = null;
    p.prompt();
    await p.userChoice;
    render();
  },
  installLater() { db.settings.installSnooze = addDays(today(), 14); save(); render(); },
  snoozeBackup() { db.settings.backupSnooze = addDays(today(), 7); save(); render(); },
  import() { document.getElementById('importFile').click(); },
  reset() {
    ask('Delete all data?', 'This removes every period and check-in from this device. It cannot be undone. Export a backup first if you want to keep them.', 'Delete everything', () => {
      db = fresh(); lock = null; save(); ui.sheet = null; ui.ob.step = 0;
    });
  },

  async unlock() {
    const input = document.getElementById('pc-unlock'), err = document.getElementById('pc-err');
    if (!input.value) return input.focus();
    err.textContent = 'Unlocking…';
    try {
      const r = await unseal(sealed, input.value);
      db = r.data; lock = r.lock; sealed = null; ver++;
      render(); persist();
    } catch {
      err.textContent = 'Wrong passcode. Try again.';
      input.value = ''; input.focus();
    }
  },
  forgot() {
    ask('Delete all data?', 'Without the passcode, nobody can open your data. This deletes it from this device so you can start again. You can then import a backup if you have one.', 'Delete everything', () => {
      sealed = null; lock = null; db = fresh(); save(); ui.ob.step = 0;
    });
  },
  pcSetup() { ui.sheet = 'passcode'; render(); document.getElementById('pc-new').focus(); },
  async pcSave() {
    const a = document.getElementById('pc-new').value, b = document.getElementById('pc-rep').value, err = document.getElementById('pc-err');
    if (a.length < 4) return (err.textContent = 'Use at least 4 characters.');
    if (a !== b) return (err.textContent = 'The passcodes do not match.');
    const on = !!lock;
    lock = await newLock(a);
    save(); ui.sheet = 'settings'; render();
    toast(on ? 'Passcode changed.' : 'Passcode on. Your data is now encrypted.');
  },
  pcOff() {
    ask('Turn off the passcode?', 'Your data will be stored on this device without encryption.', 'Turn off passcode', () => {
      lock = null; save(); toast('Passcode off.');
    });
  },
  askYes() { const f = ui.ask.onYes; ui.ask = null; f(); render(); },
  askNo() { ui.ask = null; render(); },
};

document.addEventListener('click', e => {
  // With a mouse, clicking the invisible date input only focuses it, so open the picker.
  if (e.target.id === 'ob-date' && matchMedia('(pointer: fine)').matches) try { e.target.showPicker(); } catch {}
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset.v, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.enter) { e.preventDefault(); A[e.target.dataset.enter](); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'energy') { ui.flow.d.energy = Number(e.target.value); document.getElementById('energy-label').textContent = ENERGY[ui.flow.d.energy - 1]; }
  if (e.target.id === 'note') {
    ui.flow.d.note = e.target.value;
    // Update the save button label without re-rendering the textarea.
    document.querySelector('[data-a=flSave]').textContent = e.target.value.trim() ? 'Save' : 'Skip and save';
  }
  if (e.target.id === 'ob-date' && e.target.value) { ui.ob.date = e.target.value; document.getElementById('ob-date-label').textContent = fmtDate(ui.ob.date); }
});
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
    if (!Array.isArray(data.periods) || !data.logs || typeof data.logs !== 'object') throw new Error();
    data = migrate(data);
  } catch (err) {
    return toast(err.message === 'newer' ? 'This backup comes from a newer version of phase. Update the app first.' : 'That file is not a valid backup.');
  }
  ask('Replace your data with this backup?', `The backup has ${data.periods.length} periods and ${Object.keys(data.logs).length} check-ins. Your current data will be replaced.`, 'Replace my data', () => {
    db = { ...data, onboarded: true };
    save(); ui.sheet = null; toast('Backup imported.');
  });
});
// Lock again after 5 minutes away. Otherwise re-check the time-of-day theme and the date.
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (lock && hiddenAt && Date.now() - hiddenAt > 5 * 60e3) {
    writing.then(() => {
      sealed = JSON.parse(localStorage.getItem(KEY));
      db = null; lock = null; Object.assign(ui, { flow: null, sheet: null, ask: null });
      render();
    });
  } else if (!ui.flow) render();
});

/* ---------- sample data ---------- */
function sampleData() {
  let seed = 42;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const d = fresh();
  d.onboarded = true; d.settings.sample = true;
  const lens = [28, 30, 27, 29], plens = [5, 4, 5, 6, 5];
  let s = addDays(today(), -16);
  const starts = [s];
  for (const l of lens) { s = addDays(s, -l); starts.unshift(s); }
  d.periods = starts.map((st, i) => ({ start: st, end: addDays(st, plens[i] - 1) }));
  const base = { menstrual: 2.9, follicular: 3.9, ovulatory: 4.3, luteal: 3.6, premenstrual: 2.5 };
  const feel = {
    menstrual: [['Tired', 0.6], ['Calm', 0.35], ['Low', 0.3], ['Sensitive', 0.25]],
    follicular: [['Energetic', 0.5], ['Focused', 0.45], ['Happy', 0.4], ['Content', 0.35]],
    ovulatory: [['Social', 0.6], ['Confident', 0.55], ['Happy', 0.5], ['Energetic', 0.4]],
    luteal: [['Calm', 0.45], ['Content', 0.4], ['Focused', 0.3], ['Tired', 0.25]],
    premenstrual: [['Irritable', 0.5], ['Sensitive', 0.5], ['Anxious', 0.35], ['Tired', 0.4], ['Overwhelmed', 0.2]],
  };
  const sym = {
    menstrual: [['Cramps', 0.7], ['Back pain', 0.35], ['Headache', 0.2]],
    follicular: [],
    ovulatory: [['Egg-white discharge', 0.55], ['High libido', 0.45]],
    luteal: [['Cravings', 0.35], ['Bloating', 0.2]],
    premenstrual: [['Bloating', 0.6], ['Sore breasts', 0.5], ['Cravings', 0.5], ['Acne', 0.3], ['Poor sleep', 0.3]],
  };
  const notes = ['Long walk after work. Felt clearer after.', 'Short fuse in a meeting. Noticed it and let it go.', 'Dinner with friends, lots of laughing.', 'Needed an early night. Took it.', 'Good focus all morning.'];
  const tmp = db; db = d; ver++;
  for (let day = starts[0]; day < today(); day = addDays(day, 1)) {
    if (rnd() > 0.86 && diff(day, today()) > 6) continue; // keep the last week logged so the streak shows
    const info = dayInfo(day), ph = info.phase;
    const mood = Math.min(5, Math.max(1, Math.round(base[ph] + (rnd() - 0.5) * 1.8)));
    const flowDay = info.loggedPeriod ? info.day : 0;
    d.logs[day] = {
      mood, energy: Math.min(5, Math.max(1, Math.round(base[ph] + (rnd() - 0.5) * 2))),
      feelings: feel[ph].filter(([, p]) => rnd() < p).map(([x]) => x),
      symptoms: sym[ph].filter(([, p]) => rnd() < p).map(([x]) => x),
      flow: flowDay ? ['medium', 'heavy', 'medium', 'light', 'spotting', 'spotting'][flowDay - 1] || 'spotting' : 'none',
      note: rnd() < 0.25 ? notes[Math.floor(rnd() * notes.length)] : '',
      prompt: pick(PHASES[ph].prompts, day),
    };
  }
  db = tmp; ver++;
  return d;
}

render();
if (db?.onboarded || sealed) persist();
// Block pinch zoom on iOS.
document.addEventListener('gesturestart', e => e.preventDefault());
// Offline support. Service workers only run on https or localhost.
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
